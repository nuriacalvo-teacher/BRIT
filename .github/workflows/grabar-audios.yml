# Graba los audios de los ejercicios de Listening y los sube al repositorio.
#
# No hace falta instalar nada ni abrir el terminal: se lanza desde la pestaña
# "Actions" de GitHub, con el boton "Run workflow".
#
# Tarda entre 20 y 40 minutos (son 60 audios). Se puede cerrar la pagina
# mientras tanto: sigue corriendo en los servidores de GitHub.

name: Grabar los audios de Listening

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Solo estas unidades (opcional). Ej: listening_b1_t1 listening_b2_t7'
        required: false
        default: ''
      force:
        description: 'Regrabar aunque el audio ya exista'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: grabar-audios
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar edge-tts
        run: python -m pip install --upgrade pip edge-tts

      - name: Grabar los audios
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${ONLY}" ]; then
            # shellcheck disable=SC2206
            ARGS+=(--only ${ONLY})
          fi
          if [ "${FORCE}" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 tools/build_audio.py "${ARGS[@]}"

      - name: Subir los audios al repositorio
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio
          if git diff --staged --quiet; then
            echo 'No hay audios nuevos que subir.'
            exit 0
          fi
          git commit -m 'Audios de Listening grabados automaticamente'
          git push

      - name: Resumen
        if: always()
        run: |
          if [ -f audio/manifest.json ]; then
            python3 -c "import json; d=json.load(open('audio/manifest.json'))['files']; t=sum(f['d'] for f in d.values()); print('## Audios de Listening\\n\\n- Audios grabados: **%d**\\n- Duracion total: **%d min %02d s**' % (len(d), t//60, t%60))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Audios de Listening' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No se genero ningun audio. Revisa el registro del paso anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
